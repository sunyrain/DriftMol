experiment:
  name: ext_V_DEC6_vae_s42
  output_dir: outputs/publication_ext/vae_sensitivity/ext_V_DEC6_vae_s42
  seed: 42
data:
  cache_path: data/cache/zinc250k_smiles_cache.pt
  train_ratio: 0.9
model:
  max_len: 64
  latent_dim: 256
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  ff_mult: 4
  dropout: 0.1
  num_properties: 0
  decoder_noise_std: 0.0
  free_bits: 0.25
  pos_dropout: 0.15
  dec_num_layers: 6
  pad_loss_weight: 0.5
training:
  epochs: 200
  batch_size: 512
  lr: 0.0003
  weight_decay: 0.01
  grad_clip_norm: 1.0
  beta: 0.005
  beta_warmup_epochs: 30
  kl_cycles: 0
  use_cuda: true
  eval_every: 5
  patience: 80
  selection_metric: val_loss
